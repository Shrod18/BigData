name: CI BigData

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verifier les fichiers Python
        run: |
          python -m py_compile dashboard.py
          python -m py_compile spark_dashboard_export.py
          python -m py_compile rustfs_dashboard_export.py
          python -m py_compile spark_iceberg.py
          python -m py_compile create_iceberg.py
          python -m py_compile test_iceberg.py
          python -m py_compile redpanda_producer.py
          python -m py_compile spark_redpanda_stream.py

      - name: Verifier les scripts shell
        run: |
          bash -n start-all.sh
          bash -n stop-all.sh
          bash -n status-all.sh
          bash -n sync-opencode-log.sh
          bash -n setup-redpanda.sh
          bash -n start-redpanda.sh
          bash -n stop-redpanda.sh
          bash -n status-redpanda.sh
          bash -n send-redpanda-test.sh

      - name: Verifier Docker Compose
        run: |
          docker compose -f docker-compose.yml config
          docker compose -f docker-compose.redpanda.yml config

      - name: Verifier Docsify
        run: |
          test -f docs/index.html
          test -f docs/README.md
          test -f docs/_sidebar.md

      - name: CI terminee
        run: echo "CI BigData OK"
